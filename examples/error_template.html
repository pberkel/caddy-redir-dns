<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{.Title}}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --accent:  #4f8ef7;
      --warn:    #f5c842;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    nav {
      display: flex;
      gap: 1.5rem;
      margin-left: auto;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.15s;
    }

    nav a:hover { color: var(--text); }

    /* ── Main ────────────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 6rem 1.5rem 4rem;
    }

    .card {
      width: 100%;
      max-width: 640px;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--warn);
      border: 1px solid var(--warn);
      border-radius: 4px;
      padding: 0.2rem 0.55rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 2rem;
      line-height: 1.3;
    }

    section { margin-bottom: 1.5rem; }

    h2 {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .detail {
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 0.875rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--warn);
      border-radius: 0 6px 6px 0;
      padding: 0.75rem 1rem;
      color: var(--text);
      word-break: break-word;
    }

    .resolution {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      line-height: 1.65;
      color: var(--muted);
    }

    /* ── Footer ──────────────────────────────────────────── */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0 2rem;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    footer a:hover { color: var(--text); }
  </style>
</head>
<body>

  <header>
    <span class="logo">caddy-redir-dns</span>
    <nav>
      <a href="https://github.com/pberkel/caddy-redir-dns#configuration">Documentation</a>
      <a href="https://github.com/pberkel/caddy-redir-dns">GitHub</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <div class="badge">Error</div>
      <h1>{{.Title}}</h1>

      <section>
        <h2>What happened</h2>
        <div class="detail">{{.Detail}}</div>
      </section>

      <section>
        <h2>How to resolve</h2>
        <div class="resolution">{{.Resolution}}</div>
      </section>
    </div>
  </main>

  <footer>
    <span>Powered by <a href="https://caddyserver.com">Caddy</a> and <a href="https://github.com/pberkel/caddy-redir-dns">caddy-redir-dns</a></span>
  </footer>

</body>
</html>
